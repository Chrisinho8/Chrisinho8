<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Christoph Ruckensteiner">
  <defs>
    <style>
      .dash { stroke: #5D5DFF; stroke-linecap: round; }
      .name { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    </style>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#5D5DFF" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8B8BFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5D5DFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="340" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="#0D1117"/>

    <!-- scattered code-line field -->
    <g class="dash" stroke-width="3">
      <g opacity="0.30">
        <path d="M40 46 H108"/>   <path d="M150 46 H262"/>  <path d="M980 46 H1062"/> <path d="M1104 46 H1168"/>
        <path d="M40 92 H96"/>    <path d="M138 92 H228"/>  <path d="M1008 92 H1074"/><path d="M1116 92 H1160"/>
        <path d="M40 250 H112"/>  <path d="M154 250 H240"/> <path d="M996 250 H1070"/><path d="M1108 250 H1164"/>
        <path d="M40 296 H88"/>   <path d="M130 296 H246"/> <path d="M980 296 H1058"/><path d="M1100 296 H1168"/>
      </g>
      <g opacity="0.18">
        <path d="M300 46 H392"/>  <path d="M436 46 H520"/>  <path d="M700 46 H784"/>  <path d="M828 46 H924"/>
        <path d="M286 296 H370"/> <path d="M414 296 H528"/> <path d="M690 296 H770"/> <path d="M812 296 H916"/>
        <path d="M330 92 H404"/>  <path d="M760 92 H860"/>
        <path d="M320 250 H400"/> <path d="M772 250 H872"/>
      </g>
    </g>

    <!-- accent dots -->
    <g fill="#8B8BFF">
      <circle cx="272" cy="70" r="4.5" opacity="0.85">
        <animate attributeName="opacity" values="0.85;0.25;0.85" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="944" cy="70" r="4.5" opacity="0.6">
        <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="278" r="4.5" opacity="0.75">
        <animate attributeName="opacity" values="0.75;0.2;0.75" dur="3.2s" begin="2.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- name -->
    <text class="name" x="600" y="176" text-anchor="middle" font-size="58" font-weight="500" fill="#5D5DFF">
      &lt;Chrisinho8/&gt;
      <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
    </text>

    <!-- underline -->
    <rect x="290" y="204" width="620" height="2" fill="url(#glow)">
      <animate attributeName="width" values="0;620" dur="0.9s" begin="0.6s" fill="freeze"/>
      <animate attributeName="x" values="600;290" dur="0.9s" begin="0.6s" fill="freeze"/>
    </rect>

    <!-- subtitle -->
    <text class="name" x="600" y="240" text-anchor="middle" font-size="17" font-weight="500"
          fill="#8B8BFF" letter-spacing="6">
      DATA ENGINEERING · SCIENCE
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.55;1" dur="2s" fill="freeze"/>
    </text>

    <!-- corner code glyphs -->
    <text class="name" x="70" y="180" font-size="30" fill="#5D5DFF" opacity="0.45">&lt;/&gt;</text>
    <text class="name" x="1068" y="180" font-size="30" fill="#5D5DFF" opacity="0.45">{ }</text>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="12" fill="none" stroke="#5D5DFF" stroke-opacity="0.35"/>
  </g>
</svg>
